name: API contracts and performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'benchmark/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      base:
        description: Immutable baseline commit SHA
        required: true
        default: '8563cea58fb0d84306c3252be1fd68044c07afbc'
      force_measurement:
        description: Measure even byte-identical runtimes (validate the full timing path)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  differential-performance:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
      - name: Record exact commits
        id: commits
        run: |
          echo "base=$(git -C baseline rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install identical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Configure both revisions
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          for variant in baseline candidate; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done
      - name: Verify identical benchmark sources
        run: |
          for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
              SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
              representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
              RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
              RepresentativeWorkloadReporting.hpp; do
            cmp "baseline/benchmark/$file" "candidate/benchmark/$file"
          done
      - name: Build both measurements and candidate tests
        run: |
          cmake --build baseline/build-perf --parallel 16 --target \
            chronon_single_clock_regression_benchmark \
            chronon_scheduler_invocation_benchmark chronon_representative_workload_benchmark
          cmake --build candidate/build-perf --parallel 16
      - name: Run Release correctness and deterministic equivalence tests
        run: ctest --test-dir candidate/build-perf --output-on-failure --parallel 16
      - name: Validate performance gate logic
        run: python3 -m unittest discover -s candidate/test/scripts -p 'test_api_performance*.py'
      - name: Measure all scenarios on disjoint physical CPU sets
        timeout-minutes: 75
        env:
          BASE_SHA: ${{ steps.commits.outputs.base }}
          HEAD_SHA: ${{ steps.commits.outputs.head }}
          FORCE_MEASUREMENT: ${{ inputs.force_measurement }}
        run: |
          extra=()
          if [[ "$FORCE_MEASUREMENT" == "true" ]]; then extra+=(--force-measurement); fi
          python3 candidate/scripts/run_api_performance.py \
            baseline/build-perf candidate/build-perf performance-results \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workers 2 --jobs 5 --timeout 4200 "${extra[@]}"
      - name: Retain all performance evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts-validation
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain correctness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts-tests
          path: candidate/build-perf/Testing/Temporary/
          retention-days: 30
