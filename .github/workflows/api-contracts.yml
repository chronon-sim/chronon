name: API contracts and performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'benchmark/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      base:
        description: Immutable baseline commit SHA
        required: true
        default: '8563cea58fb0d84306c3252be1fd68044c07afbc'
      force_measurement:
        description: Measure even byte-identical runtimes (validate the full timing path)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      base: ${{ steps.commits.outputs.base }}
      head: ${{ steps.commits.outputs.head }}
      shards: ${{ steps.identity.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
      - name: Record exact commits
        id: commits
        run: |
          echo "base=$(git -C baseline rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install identical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Configure both revisions
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          for variant in baseline candidate; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done
      - name: Verify identical benchmark sources
        run: |
          for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
              SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
              representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
              RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
              RepresentativeWorkloadReporting.hpp; do
            cmp "baseline/benchmark/$file" "candidate/benchmark/$file"
          done
      - name: Build both measurements and candidate tests
        run: |
          cmake --build baseline/build-perf --parallel 4 --target \
            chronon_single_clock_regression_benchmark \
            chronon_scheduler_invocation_benchmark chronon_representative_workload_benchmark
          cmake --build candidate/build-perf --parallel 4
      - name: Run Release correctness and deterministic equivalence tests
        run: ctest --test-dir candidate/build-perf --output-on-failure --parallel 4
      - name: Validate performance gate logic
        run: python3 -m unittest discover -s candidate/test/scripts -p 'test_api_performance*.py'
      - name: Validate identical runtimes here; defer timing to independent runners
        id: identity
        env:
          BASE_SHA: ${{ steps.commits.outputs.base }}
          HEAD_SHA: ${{ steps.commits.outputs.head }}
          FORCE_MEASUREMENT: ${{ inputs.force_measurement }}
        run: |
          extra=()
          if [[ "$FORCE_MEASUREMENT" == "true" ]]; then extra+=(--force-measurement); fi
          status=0
          python3 candidate/scripts/check_api_performance.py \
            baseline/build-perf candidate/build-perf performance-results \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workers 2 --defer-measurement "${extra[@]}" || status=$?
          case "$status" in
            0) echo "shards=1" >> "$GITHUB_OUTPUT" ;;
            3) echo "shards=6" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Retain identity evidence, including failed checks
        if: always() && steps.identity.outputs.shards != '6'
        uses: actions/upload-artifact@v4
        with:
          name: api-performance-0
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Package the measured executables once
        if: steps.identity.outputs.shards == '6'
        run: |
          files=()
          for variant in baseline candidate; do
            files+=("$variant/build-perf/CMakeCache.txt")
            for binary in chronon_single_clock_regression_benchmark \
                chronon_scheduler_invocation_benchmark chronon_representative_workload_benchmark; do
              files+=("$variant/build-perf/benchmark/$binary")
            done
          done
          tar -czf performance-builds.tar.gz "${files[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.identity.outputs.shards == '6'
        with:
          name: performance-builds
          path: performance-builds.tar.gz
          compression-level: 0
          retention-days: 7
      - name: Retain correctness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts-tests
          path: candidate/build-perf/Testing/Temporary/
          retention-days: 30

  measure:
    needs: prepare
    if: needs.prepare.outputs.shards == '6'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - uses: actions/download-artifact@v4
        with:
          name: performance-builds
      - name: Restore executables and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev libfmt-dev zlib1g-dev
          tar -xzf performance-builds.tar.gz
      - name: Enforce unchanged acceptance rules on an independent runner
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          SHARD: ${{ matrix.shard }}
          FORCE_MEASUREMENT: ${{ inputs.force_measurement }}
        run: |
          extra=()
          if [[ "$FORCE_MEASUREMENT" == "true" ]]; then extra+=(--force-measurement); fi
          python3 scripts/check_api_performance.py \
            baseline/build-perf candidate/build-perf performance-results \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workers 2 --shard-index "$SHARD" --shard-count 6 "${extra[@]}"
      - name: Retain this shard's raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-performance-${{ matrix.shard }}
          path: performance-results/
          if-no-files-found: error
          retention-days: 30

  differential-performance:
    if: always()
    needs: [prepare, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the selected validation path to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
          SHARDS: ${{ needs.prepare.outputs.shards }}
        run: |
          test "$PREPARE_RESULT" = success
          case "$SHARDS" in
            1) test "$MEASURE_RESULT" = skipped ;;
            6) test "$MEASURE_RESULT" = success ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - uses: actions/download-artifact@v4
        with:
          pattern: api-performance-*
          path: performance-results/shards
      - name: Require all 29 scenarios exactly once
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          SHARDS: ${{ needs.prepare.outputs.shards }}
        run: |
          python3 scripts/collect_api_performance.py \
            performance-results/shards performance-results \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --shards "$SHARDS" --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: api-contracts-validation
          path: performance-results/
          if-no-files-found: error
          retention-days: 30
