name: PR review wall-time reproduction
on:
  workflow_dispatch:
    inputs:
      receive:
        required: true
permissions:
  contents: read
jobs:
  repeat:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: outliers-1
            sha: ${{ inputs.receive }}
          - label: outliers-2
            sha: ${{ inputs.receive }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 0c8b6f2379f9c8bec09a7cbc258c8df72604b7e1
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ matrix.sha }}
      - uses: actions/checkout@v4
        with:
          path: original
          ref: 7829ac985c461c12ba7bada0c560efb850ce4823
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          for PERF_PATH in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$PERF_PATH" ]]; then echo "PERF_BINARY=$PERF_PATH" >> "$GITHUB_ENV"; break; fi
          done
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Build revisions with the identical controlled harness
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          mkdir results
          for variant in baseline candidate original; do
            if [[ ! -d "$variant" ]]; then continue; fi
            git -C "$variant" rev-parse HEAD > "results/$variant.sha"
            cp harness/benchmark/representative_workload_benchmark.cpp "$variant/benchmark/representative_workload_benchmark.cpp"
            for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
                SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
                representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
                RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
                RepresentativeWorkloadReporting.hpp; do
              cmp "baseline/benchmark/$file" "$variant/benchmark/$file"
            done
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build "$variant/build-perf" --parallel 16 --target \
              chronon_representative_workload_benchmark chronon_scheduler_invocation_benchmark
          done
      - name: Repeat the two new outliers and the static-clock control across fresh instances
        run: |
          CPUS=$(PYTHONPATH=baseline/scripts python3 -c 'from check_api_performance import physical_cpus; print(",".join(map(str,physical_cpus(2))))')
          for CASE in clock1-threads2-dynamic1-poll1 clock1-threads2-dynamic0-poll1 backpressure-threads2; do
            python3 harness/scripts/review_fresh_instances.py --scripts baseline/scripts \
              --baseline baseline/build-perf --original original/build-perf --candidate candidate/build-perf \
              --output "results/$CASE" --instances "fresh-executables-$CASE" --cpus "$CPUS" \
              --case "$CASE" --cycle-scale 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-experiment-${{ matrix.label }}
          path: results/
          retention-days: 30
