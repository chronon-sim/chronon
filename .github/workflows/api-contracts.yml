name: API contracts and performance

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'examples/**'
      - 'benchmark/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      base:
        description: Immutable baseline commit SHA
        required: true
        default: '8563cea58fb0d84306c3252be1fd68044c07afbc'

permissions:
  contents: read

concurrency:
  group: api-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  differential-performance:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
      - name: Record exact commits
        id: commits
        run: |
          echo "base=$(git -C baseline rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install identical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Configure both revisions
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          for variant in baseline candidate; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done
      - name: Verify identical benchmark sources
        run: |
          for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
              SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
              representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
              RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
              RepresentativeWorkloadReporting.hpp; do
            cmp "baseline/benchmark/$file" "candidate/benchmark/$file"
          done
      - name: Build both measurements and candidate tests
        run: |
          cmake --build baseline/build-perf --parallel 16 --target \
            chronon_single_clock_regression_benchmark \
            chronon_scheduler_invocation_benchmark chronon_representative_workload_benchmark
          cmake --build candidate/build-perf --parallel 16
      - name: Run Release correctness and deterministic equivalence tests
        run: ctest --test-dir candidate/build-perf --output-on-failure --parallel 16
      - name: Validate benchmark scripts, measurement and reporting logic
        run: python3 -m unittest discover -s candidate/test/scripts -p 'test_*.py'
      - name: Measure all scenarios on disjoint physical CPU sets
        timeout-minutes: 11
        env:
          BASE_SHA: ${{ steps.commits.outputs.base }}
          HEAD_SHA: ${{ steps.commits.outputs.head }}
        run: |
          python3 candidate/scripts/run_api_performance.py \
            baseline/build-perf candidate/build-perf performance-results \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --workers 2 --jobs 8 --timeout 600
      - name: Add wall times to the workflow summary
        if: always()
        run: |
          if [[ -f performance-results/report.md ]]; then
            cat performance-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain all performance evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts-validation
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain correctness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts-tests
          path: candidate/build-perf/Testing/Temporary/
          retention-days: 30

  performance-report:
    needs: differential-performance
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download measured wall times
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-contracts-validation
          path: performance-results
      - name: Update PR performance comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const repo = context.repo;
            const current = await github.rest.pulls.get({...repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) {
              core.info('A newer commit is already on the PR; skip this outdated report.');
              return;
            }
            const marker = '<!-- chronon-api-performance -->';
            const file = 'performance-results/report.md';
            const url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            let body = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') :
              `${marker}\n## Performance wall time\n\nMeasurement did not complete for \`${pr.head.sha}\`; see the workflow logs.`;
            body += `\n[Workflow run and raw artifacts](${url})\n`;
            const comments = await github.paginate(github.rest.issues.listComments,
              {...repo, issue_number: pr.number, per_page: 100});
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({...repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...repo, issue_number: pr.number, body});
            }
