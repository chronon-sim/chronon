name: PR review wall-time reproduction
on:
  workflow_dispatch:
    inputs:
      pr158:
        default: efe61ccd6f07dcddd8a796dd216ab9e446788ee0
      pr160:
        default: 3d2c42f1b1ffe2821d0e043a956adbb00c3af2a4
permissions:
  contents: read
jobs:
  repeat:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 160
            replica: 1
            sha: ${{ inputs.pr160 }}
            cases: broadcast-threads2
          - pr: 160
            replica: 2
            sha: ${{ inputs.pr160 }}
            cases: broadcast-threads2
          - pr: 160
            replica: 3
            sha: ${{ inputs.pr160 }}
            cases: broadcast-threads2
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 0c8b6f2379f9c8bec09a7cbc258c8df72604b7e1
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ matrix.sha }}
      - uses: actions/checkout@v4
        if: matrix.pr == 160
        with:
          path: original
          ref: 7829ac985c461c12ba7bada0c560efb850ce4823
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          for PERF_PATH in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$PERF_PATH" ]]; then echo "PERF_BINARY=$PERF_PATH" >> "$GITHUB_ENV"; break; fi
          done
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Build revisions with the identical controlled harness
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          mkdir results
          for variant in baseline candidate original; do
            if [[ ! -d "$variant" ]]; then continue; fi
            git -C "$variant" rev-parse HEAD > "results/$variant.sha"
            cp harness/benchmark/representative_workload_benchmark.cpp "$variant/benchmark/representative_workload_benchmark.cpp"
            for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
                SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
                representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
                RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
                RepresentativeWorkloadReporting.hpp; do
              cmp "baseline/benchmark/$file" "$variant/benchmark/$file"
            done
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build "$variant/build-perf" --parallel 16 --target \
              chronon_representative_workload_benchmark
          done
      - name: Uninstrumented three-way comparison
        run: |
          CPUS=$(PYTHONPATH=baseline/scripts python3 -c 'from check_api_performance import physical_cpus; print(",".join(map(str,physical_cpus(2))))')
          python3 harness/scripts/repeat_review_performance.py --scripts baseline/scripts \
            --baseline baseline/build-perf --original original/build-perf --candidate candidate/build-perf \
            --output results/uninstrumented --cpus "$CPUS" --repeats 24 --cases broadcast-threads2 --cycle-scale 5
      - name: Profile original compiler layout
        continue-on-error: true
        run: |
          python3 harness/scripts/review_broadcast_profile.py \
            baseline/build-perf original/build-perf candidate/build-perf results/profiles --perf "$PERF_BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: review-profile-raw-${{ matrix.replica }}
          path: results/
          retention-days: 30
      - name: Align functions identically in all three revisions
        run: |
          for variant in baseline candidate original; do
            git -C "$variant" apply "$GITHUB_WORKSPACE/harness/scripts/review_function_alignment.patch"
            cmake -S "$variant" -B "$variant/build-perf"
            cmake --build "$variant/build-perf" --parallel 16 --target chronon_representative_workload_benchmark
            nm -SC "$variant/build-perf/benchmark/chronon_representative_workload_benchmark" > "results/aligned-$variant-symbols.txt"
          done
      - name: Repeat with common function alignment
        run: |
          CPUS=$(PYTHONPATH=baseline/scripts python3 -c 'from check_api_performance import physical_cpus; print(",".join(map(str,physical_cpus(2))))')
          python3 harness/scripts/repeat_review_performance.py --scripts baseline/scripts \
            --baseline baseline/build-perf --original original/build-perf --candidate candidate/build-perf \
            --output results/aligned --cpus "$CPUS" --repeats 24 --cases broadcast-threads2 --cycle-scale 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-profile-${{ matrix.replica }}
          path: results/
          retention-days: 30
