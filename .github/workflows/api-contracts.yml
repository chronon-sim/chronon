name: PR review wall-time reproduction
on:
  workflow_dispatch:
    inputs:
      pr158:
        default: f9aca0fd3cc855523e87c3f1bf708a9715564f93
      pr159:
        default: 7181ad281436076d5ebd4a9e52cd83982b3585fc
      pr160:
        default: d4f9a00f1f3d9d6ea33459ee8e4b9355e5a49046
permissions:
  contents: read
jobs:
  repeat:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 160
            sha: ${{ inputs.pr160 }}
            cases: broadcast-threads2
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 0c8b6f2379f9c8bec09a7cbc258c8df72604b7e1
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ matrix.sha }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Build identical workloads and record commits
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          mkdir results
          git -C baseline rev-parse HEAD > results/baseline.sha
          git -C candidate rev-parse HEAD > results/candidate.sha
          for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
              SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
              representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
              RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
              RepresentativeWorkloadReporting.hpp; do
            cmp "baseline/benchmark/$file" "candidate/benchmark/$file"
          done
          for variant in baseline candidate; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build "$variant/build-perf" --parallel 16 --target \
              chronon_single_clock_regression_benchmark chronon_scheduler_invocation_benchmark \
              chronon_representative_workload_benchmark
          done
      - name: Repeat the broadcast signal with exact CI work
        env:
          CASES: ${{ matrix.cases }}
        run: |
          CPUS=$(PYTHONPATH=baseline/scripts python3 -c 'from check_api_performance import physical_cpus; print(",".join(map(str,physical_cpus(2))))')
          python3 harness/scripts/repeat_review_performance.py --scripts baseline/scripts \
            --baseline baseline/build-perf --candidate candidate/build-perf \
            --output results/matrix --cpus "$CPUS" --repeats 32 --cases "$CASES"
      - name: Repeat with five times the work
        env:
          CASES: ${{ matrix.cases }}
        run: |
          CPUS=$(PYTHONPATH=baseline/scripts python3 -c 'from check_api_performance import physical_cpus; print(",".join(map(str,physical_cpus(2))))')
          python3 harness/scripts/repeat_review_performance.py --scripts baseline/scripts \
            --baseline baseline/build-perf --candidate candidate/build-perf \
            --output results/focused --cpus "$CPUS" --repeats 24 --cases "$CASES" --cycle-scale 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-walltime-${{ matrix.pr }}
          path: results/
          retention-days: 30
