name: PR 156 runner machine code

on:
  push:
    branches: [diagnose/pr156-performance]

permissions:
  contents: read

concurrency:
  group: pr156-isolated-diagnosis
  cancel-in-progress: true

jobs:
  diagnostic-only:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 3c0e43bb59418bda1d167064c039201bcb5d27e9
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 456f67a2cbd4d22b3aef715509a32639d424febe
      - name: Record exact commits
        id: commits
        run: |
          echo "base=$(git -C baseline rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install identical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Configure both revisions
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          for variant in baseline candidate; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done
      - name: Verify identical benchmark sources
        run: |
          for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
              SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
              representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
              RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
              RepresentativeWorkloadReporting.hpp; do
            cmp "baseline/benchmark/$file" "candidate/benchmark/$file"
          done
      - name: Build exact scheduler binaries
        run: |
          for variant in baseline candidate; do
            cmake --build "$variant/build-perf" --parallel 16 --target chronon_scheduler_invocation_benchmark
          done
      - name: Retain exact GCC 12.4 machine code
        run: |
          for variant in baseline candidate; do
            mkdir -p "performance-results/$variant"
            cp "$variant/build-perf/benchmark/chronon_scheduler_invocation_benchmark" "performance-results/$variant/"
            cp "$variant/build-perf/benchmark/CMakeFiles/chronon_scheduler_invocation_benchmark.dir/scheduler_invocation_benchmark.cpp.o" "performance-results/$variant/"
            for object in TickSimulationClockParallel.cpp.o TickSimulationClocks.cpp.o TickSimulationDynamicRuntime.cpp.o CrashHandler.cpp.o; do
              cp "$variant/build-perf/src/CMakeFiles/chronon.dir/sender/core/$object" "performance-results/$variant/"
            done
            cp "$variant/build-perf/CMakeCache.txt" "performance-results/$variant/"
          done
          g++-12 --version > performance-results/compiler.txt
          mkdir performance-results/libraries
          ldd candidate/build-perf/benchmark/chronon_scheduler_invocation_benchmark > performance-results/ldd.txt
          awk '/=> \// {print $3} /^\s*\// {print $1}' performance-results/ldd.txt | while read -r library; do
            cp -L "$library" performance-results/libraries/
          done
          cp -L /lib64/ld-linux-x86-64.so.2 performance-results/libraries/
      - name: Retain all performance evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr156-runner-code
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 30
