name: PR 156 receiver codegen diagnosis

on:
  push:
    branches: [diagnose/pr156-performance]

permissions:
  contents: read

concurrency:
  group: pr156-isolated-diagnosis
  cancel-in-progress: true

jobs:
  diagnostic-only:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 893d2c5e0e12dd2ab279613b776436d3b35df05b
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 456f67a2cbd4d22b3aef715509a32639d424febe
      - name: Record exact commits
        id: commits
        run: |
          echo "base=$(git -C baseline rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install identical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Prepare two bounded receiver prototypes
        run: python3 probe/.github/diagnostics/pr156-probe.py prepare
      - name: Configure all variants
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          for variant in baseline candidate named outlined; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          done
      - name: Verify identical benchmark sources
        run: |
          for file in single_clock_regression.cpp scheduler_invocation_benchmark.cpp \
              SchedulerInvocationModel.hpp BenchmarkThreadAffinity.hpp \
              representative_workload_benchmark.cpp RepresentativeWorkload.hpp \
              RepresentativeWorkloadCalibration.hpp RepresentativeWorkloadOptions.hpp \
              RepresentativeWorkloadReporting.hpp; do
            cmp "baseline/benchmark/$file" "candidate/benchmark/$file"
          done
      - name: Build representative workloads and ingress correctness tests
        run: |
          for variant in baseline candidate named outlined; do
            cmake --build "$variant/build-perf" --parallel 16 --target chronon_representative_workload_benchmark
          done
      - name: Validate prototype ingress correctness
        run: |
          for variant in candidate named outlined; do
            cmake --build "$variant/build-perf" --parallel 16 --target sender_test_mpsc_ingress_cache
            ctest --test-dir "$variant/build-perf" -R '^sender_mpsc_ingress_cache$' --output-on-failure
          done
      - name: Preserve compiler evidence
        run: |
          mkdir -p performance-results/libraries
          g++-12 --version > performance-results/compiler.txt
          lscpu > performance-results/lscpu.txt
          for variant in baseline candidate named outlined; do
            mkdir -p "performance-results/$variant"
            cp "$variant/build-perf/benchmark/chronon_representative_workload_benchmark" "performance-results/$variant/"
            cp "$variant/build-perf/CMakeCache.txt" "$variant/src/sender/port/InPort.hpp" "$variant/src/sender/port/MultiProducerQueueAdapter.hpp" "performance-results/$variant/"
            nm -SC "$variant/build-perf/benchmark/chronon_representative_workload_benchmark" > "performance-results/$variant/symbols.txt"
          done
          ldd candidate/build-perf/benchmark/chronon_representative_workload_benchmark > performance-results/ldd.txt
          awk '/=> \// {print $3} /^\s*\// {print $1}' performance-results/ldd.txt | while read -r library; do
            cp -L "$library" performance-results/libraries/
          done
          cp -L /lib64/ld-linux-x86-64.so.2 performance-results/libraries/
      - name: Fixed 31-block sequential diagnosis (not acceptance)
        run: python3 probe/.github/diagnostics/pr156-probe.py measure
      - name: Retain all performance evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr156-codegen-evidence
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 30
