name: PR 156 wall-time profiling
on:
  push:
    branches: [diagnose/pr156-performance]
permissions:
  contents: read
concurrency:
  group: pr156-isolated-diagnosis
  cancel-in-progress: true
jobs:
  diagnostic-only:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 9c222a16eb509726f3ab09d7630dbf197fe107eb
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 456f67a2cbd4d22b3aef715509a32639d424febe
      - name: Install build and profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache g++-12 libyaml-cpp-dev libfmt-dev zlib1g-dev linux-tools-generic
          mkdir -p performance-results
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 > performance-results/perf-access.txt 2>&1 || true
          perf_path=
          for perf_candidate in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$perf_candidate" ]]; then perf_path="$perf_candidate"; break; fi
          done
          test -n "$perf_path"
          echo "PERF_BINARY=$perf_path" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: api-contracts-gcc12-release
      - name: Build exact Release binaries
        env:
          CXX: g++-12
          CPM_SOURCE_CACHE: ${{ github.workspace }}/dependencies
        run: |
          for variant in baseline candidate; do
            cmake -S "$variant" -B "$variant/build-perf" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCHRONON_ENABLE_WERROR=ON \
              -DCHRONON_BUILD_BENCHMARKS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build "$variant/build-perf" --parallel 16 --target \
              chronon_single_clock_regression_benchmark chronon_scheduler_invocation_benchmark \
              chronon_representative_workload_benchmark
          done
      - name: Preserve exact compiler and binary evidence
        run: |
          g++-12 --version > performance-results/compiler.txt
          lscpu > performance-results/lscpu.txt
          uname -a > performance-results/kernel.txt
          "$PERF_BINARY" --version > performance-results/perf-version.txt
          for variant in baseline candidate; do
            mkdir -p "performance-results/$variant"
            cp "$variant/build-perf/benchmark/chronon_single_clock_regression_benchmark" \
              "$variant/build-perf/benchmark/chronon_scheduler_invocation_benchmark" \
              "$variant/build-perf/CMakeCache.txt" "performance-results/$variant/"
            cp "$variant/build-perf/src/CMakeFiles/chronon.dir/sender/core/TickSimulationClockParallel.cpp.o"               "$variant/build-perf/src/CMakeFiles/chronon.dir/sender/core/TickSimulationClockMigration.cpp.o"               "$variant/build-perf/src/CMakeFiles/chronon.dir/sender/core/TickSimulationDynamicRebalance.cpp.o"               "performance-results/$variant/"
            ldd "$variant/build-perf/benchmark/chronon_scheduler_invocation_benchmark" > "performance-results/$variant/ldd.txt"
            nm -SC "$variant/build-perf/benchmark/chronon_scheduler_invocation_benchmark" > "performance-results/$variant/symbols.txt"
          done
      - name: Fixed 24-block isolated comparisons with identical-binary control
        run: python3 probe/.github/diagnostics/pr156-wall-time.py measure baseline/build-perf candidate/build-perf performance-results
      - name: Perf counters and CPU stack profiles
        run: python3 probe/.github/diagnostics/pr156-wall-time.py profile baseline/build-perf candidate/build-perf performance-results/profiles --perf "$PERF_BINARY"
      - name: Eight repetitions of the unchanged concurrent PR matrix
        run: python3 probe/.github/diagnostics/pr156-wall-time.py matrix baseline/build-perf candidate/build-perf performance-results/concurrent
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr156-wall-time-profiles
          path: performance-results/
          retention-days: 30
